<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="theme-color" content="#101a35" />
  <title>Private Preview | ObanimiStudio</title>
  <link rel="canonical" href="https://obanimistudio.com/destination-of-peace/" />
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#081226,#172b51);font-family:Inter,Arial,sans-serif;color:#fff}
    main{width:min(620px,100%);padding:48px 30px;text-align:center;border:1px solid rgba(255,255,255,.16);border-radius:28px;background:rgba(255,255,255,.08);box-shadow:0 24px 70px rgba(0,0,0,.35)}
    .lock{font-size:54px}
    h1{margin:18px 0 12px;font-size:clamp(30px,6vw,48px)}
    p{margin:0 auto;max-width:470px;color:#d8e3f8;font-size:18px;line-height:1.6}
    .brand{margin-top:30px;color:#f4c84b;font-weight:800;letter-spacing:.08em}
  </style>
</head>
<body>
  <main>
    <div class="lock" aria-hidden="true">🔒</div>
    <h1>Private preview</h1>
    <p>This website is currently being prepared by ObanimiStudio and is not yet available for public viewing.</p>
    <div class="brand">OBANIMISTUDIO</div>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => registrations.forEach(registration => registration.unregister()));
    }
    if ('caches' in window) {
      caches.keys().then(keys => keys.forEach(key => caches.delete(key)));
    }
  </script>
</body>
</html>
